# The two cross-origin URLs below (WEB_ORIGIN, VITE_API_BASE_URL) are the names requested here;
# Render may append a suffix to the real hostnames, in which case they are corrected after the
# services are created.
#
# Builds use `npm ci` against the committed lockfile, so production installs exactly what CI
# tested. The lockfile must record every platform's optional native binaries (for example
# `@tailwindcss/oxide-linux-x64-gnu`); npm drops the other platforms' entries when it rewrites the
# lockfile from an existing Windows node_modules (npm/cli#4828). If a Linux build reports a missing
# native binding, regenerate the lockfile from the manifests alone, without node_modules, rather
# than deleting it at build time.
#
# `autoDeployTrigger: checksPass` deploys a commit only after its GitHub checks (the CI workflow in
# .github/workflows/ci.yml) have passed.
services:
  - type: web
    name: payslip-ocr-api
    runtime: node
    plan: free
    region: frankfurt
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node api/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: WEB_ORIGIN
        value: https://payslip-ocr-client.onrender.com
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: MAX_PDF_PAGES
        value: "10"
      # Secrets and per-project values: Render will prompt for these in the
      # dashboard when the blueprint is created rather than storing them here.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: STORAGE_BUCKET
        sync: false

  - type: web
    name: payslip-ocr-client
    runtime: static
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_BASE_URL
        value: https://payslip-ocr-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
